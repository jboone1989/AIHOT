name: 方案讨论 / Plan discussion
description: 和 Claude、ChatGPT 一起商量一个新项目或大改动，定下方案再开工，见 docs/agent-collab.md。
labels: [stage:plan, agent:codex]
body:
  - type: textarea
    id: goal
    attributes:
      label: 想做什么
      description: 要解决的问题、给谁用、做成什么样算完成。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 限制和已知情况
      description: 必须用或不能用的东西、时间、预算、相关的代码和 PR。
  - type: textarea
    id: questions
    attributes:
      label: 想让两边回答的问题
      description: 例如“用哪种方案”“风险在哪”“分几步做”。

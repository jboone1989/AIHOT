# Final layer: production consumes immutable versioned application images.
# Building happens on cn-dev; VM09 only loads the images and recreates containers.
services:
  setup:
    image: livingruntime-app:${LRSITE_APP_RELEASE:?Set LRSITE_APP_RELEASE}
  api:
    image: livingruntime-app:${LRSITE_APP_RELEASE:?Set LRSITE_APP_RELEASE}
  worker:
    image: livingruntime-app:${LRSITE_APP_RELEASE:?Set LRSITE_APP_RELEASE}
  web:
    image: livingruntime-app:${LRSITE_APP_RELEASE:?Set LRSITE_APP_RELEASE}
  knowledge:
    image: livingruntime-knowledge:${LRSITE_KNOWLEDGE_RELEASE:?Set LRSITE_KNOWLEDGE_RELEASE}
